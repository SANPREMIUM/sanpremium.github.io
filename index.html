<style>
:root{--bg:#f4f6ff;--card:#fff;--text:#161a2b;--muted:#5b6280;--accent:#4f6bff;--line:rgba(127,127,127,.25)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d16;--card:#151827;--text:#eef0ff;--muted:#9aa1c4;--accent:#7b8cff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;width:100%;background:var(--card);border-radius:24px;padding:32px 22px 24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.12)}
img{width:92px;height:92px;border-radius:24px}
h1{margin:16px 0 6px;font-size:28px}
.tag{color:var(--muted);margin:0 0 24px;line-height:1.5}
.menu{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--text);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:700;font-size:16px}
.opt small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
.opt .ic{font-size:26px;width:36px;text-align:center}
.opt.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.primary small{color:rgba(255,255,255,.85)}
.opt.off{opacity:.5;pointer-events:none}
.foot{margin:22px 0 0;font-size:12.5px;color:var(--muted)}

<script>

var LINKS={

  kontak:'https://wa.me/6281398803306?text=Permisi%2C%20saya%20ingin%20bertanya%20tentang%20SANN%20Toolbox.'
};
[['optApk','apk'],['optKontak','kontak']].forEach(function(x){

});
</script>
